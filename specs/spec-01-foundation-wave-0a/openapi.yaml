openapi: 3.1.0
info:
  title: GEOPS Wave 0A API
  version: 0.1.0-draft
  description: >
    Contrato Wave 0A sintético; activación solo con binding fake y evidencia simulada. Para identidad prevalece
    specs/spec-00-technical-feasibility/identity-api-contract.md.
    Las respuestas del proveedor MDM real no están validadas en Free.
servers:
  - url: http://localhost:3500
    description: Desarrollo local; producción requiere HTTPS.
tags:
  - name: Health
  - name: AdminAuth
  - name: Identity
  - name: Inventory
  - name: MDM
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      responses:
        '200':
          description: Proceso vivo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      description: Solo red interna/operador; verifica DB y migraciones.
      responses:
        '200':
          description: Dependencias listas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/AdminError'
  /v1/admin/auth/sessions:
    post:
      tags: [AdminAuth]
      operationId: createAdminSession
      description: Login con Origin permitido y rate limit; emite cookie HttpOnly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión creada; Set-Cookie no contiene token MDM.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/AdminError'
        '429':
          $ref: '#/components/responses/AdminError'
  /v1/admin/auth/me:
    get:
      tags: [AdminAuth]
      operationId: getCurrentAdmin
      security:
        - adminCookie: []
      responses:
        '200':
          description: Perfil administrativo mínimo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfile'
        '401':
          $ref: '#/components/responses/AdminError'
  /v1/admin/auth/sessions/current:
    delete:
      tags: [AdminAuth]
      operationId: revokeCurrentAdminSession
      security:
        - adminCookie: []
          csrfHeader: []
      responses:
        '204':
          description: Sesión revocada.
        '401':
          $ref: '#/components/responses/AdminError'
        '403':
          $ref: '#/components/responses/AdminError'
  /v1/admin/devices:
    get:
      tags: [Inventory]
      operationId: listGeopsDevices
      description: Synthetic enrollment inventory only; requires gps.installation.manage.
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Inventario GEOPS paginado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePage'
        '401':
          $ref: '#/components/responses/AdminError'
    post:
      tags: [Inventory]
      operationId: createGeopsDevice
      description: Creates a synthetic DRAFT; requires gps.installation.manage and does not enroll MDM.
      security:
        - adminCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [display_label]
              properties:
                display_label:
                  type: string
                  minLength: 1
                  maxLength: 120
      responses:
        '201':
          description: Registro DRAFT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/AdminError'
        '403':
          $ref: '#/components/responses/AdminError'
  /v1/admin/devices/{device_id}/invitations:
    post:
      tags: [Identity]
      operationId: createDeviceInvitation
      security:
        - adminCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationRequest'
      responses:
        '201':
          description: Secreto visible una sola vez.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '409':
          $ref: '#/components/responses/IdentityError'
        '403':
          $ref: '#/components/responses/IdentityError'
  /v1/device/enrollment/claims:
    post:
      tags: [Identity]
      operationId: createEnrollmentClaim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
      responses:
        '201':
          description: Challenge de posesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeResponse'
        '409':
          $ref: '#/components/responses/IdentityError'
        '410':
          $ref: '#/components/responses/IdentityError'
        '429':
          $ref: '#/components/responses/IdentityError'
  /v1/device/enrollment/claims/{claim_id}/proof:
    post:
      tags: [Identity]
      operationId: proveEnrollmentClaim
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofRequest'
      responses:
        '200':
          description: Pendiente de confirmación física.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofResponse'
        '401':
          $ref: '#/components/responses/IdentityError'
        '409':
          $ref: '#/components/responses/IdentityError'
  /v1/admin/devices/{device_id}/synthetic-evidence:
    post:
      tags: [Identity]
      operationId: recordSyntheticEvidence
      description: Solo desarrollo con binding fake; nunca acredita verificación física ni MDM real.
      security:
        - adminCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [claim_id, physical_confirmed, attestation_exception]
              properties:
                claim_id: {$ref: '#/components/schemas/Uuid'}
                physical_confirmed: {const: true}
                attestation_exception: {type: boolean}
      responses:
        '200':
          description: Referencia inmutable de simulación, ligada a claim, binding y operador.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [evidence_ref, source]
                properties:
                  evidence_ref: {$ref: '#/components/schemas/Uuid'}
                  source: {const: fake}
        '403':
          $ref: '#/components/responses/IdentityError'
  /v1/admin/devices/{device_id}/activate:
    post:
      tags: [Identity]
      operationId: activateDevice
      description: Requiere confirmación física y verificación MDM independiente. Deshabilitado para dispositivos reales en 0A.
      security:
        - adminCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateRequest'
      responses:
        '200':
          description: Activado tras validaciones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivateResponse'
        '403':
          $ref: '#/components/responses/IdentityError'
        '409':
          $ref: '#/components/responses/IdentityError'
  /v1/device/sessions/challenge:
    post:
      tags: [Identity]
      operationId: createDeviceSessionChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionChallengeRequest'
      responses:
        '200':
          description: Challenge de sesión de un uso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionChallengeResponse'
        '403':
          $ref: '#/components/responses/IdentityError'
  /v1/device/sessions:
    post:
      tags: [Identity]
      operationId: createDeviceSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
      responses:
        '201':
          description: Token opaco válido 15 minutos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/IdentityError'
        '409':
          $ref: '#/components/responses/IdentityError'
  /v1/device/keys/rotate/challenge:
    post:
      tags: [Identity]
      operationId: createKeyRotationChallenge
      security:
        - deviceBearer: []
          deviceProof: []
      responses:
        '200':
          description: Challenge de rotación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotationChallengeResponse'
        '401':
          $ref: '#/components/responses/IdentityError'
  /v1/device/keys/rotate:
    post:
      tags: [Identity]
      operationId: rotateDeviceKey
      security:
        - deviceBearer: []
          deviceProof: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateRequest'
      responses:
        '200':
          description: Clave nueva activa; sesiones viejas revocadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateResponse'
        '401':
          $ref: '#/components/responses/IdentityError'
        '409':
          $ref: '#/components/responses/IdentityError'
  /v1/admin/devices/{device_id}/revoke:
    post:
      tags: [Identity]
      operationId: revokeDevice
      security:
        - adminCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
      responses:
        '200':
          description: Revocado, incluso si ya estaba revocado.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: REVOKED
        '403':
          $ref: '#/components/responses/IdentityError'
  /v1/admin/mdm/status:
    get:
      tags: [MDM]
      operationId: getMdmStatus
      security:
        - adminCookie: []
      responses:
        '200':
          description: Estado sanitizado; sin credenciales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MdmStatus'
        '401':
          $ref: '#/components/responses/AdminError'
  /v1/admin/mdm/devices:
    get:
      tags: [MDM]
      operationId: listMdmDevices
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Inventario paginado; source=fake o manageengine_trial.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MdmDevicePage'
        '403':
          $ref: '#/components/responses/AdminError'
        '429':
          $ref: '#/components/responses/AdminError'
        '503':
          $ref: '#/components/responses/AdminError'
components:
  parameters:
    DeviceId:
      name: device_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ClaimId:
      name: claim_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 2048
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  securitySchemes:
    adminCookie:
      type: apiKey
      in: cookie
      name: geops_admin
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
    deviceBearer:
      type: http
      scheme: bearer
    deviceProof:
      type: apiKey
      in: header
      name: X-GEOPS-Signature
      description: >
        También requiere X-GEOPS-Key-Id, X-GEOPS-Timestamp y X-GEOPS-Nonce.
        La cadena firmada y la ventana temporal se definen en SPEC-00.
  responses:
    AdminError:
      description: Error administrativo sanitizado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminError'
    IdentityError:
      description: Error de identidad conforme a SPEC-00.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IdentityError'
  schemas:
    Uuid:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 UTC.
    Base64url:
      type: string
      pattern: '^[A-Za-z0-9_-]+$'
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    AdminError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}
    IdentityError:
      type: object
      additionalProperties: false
      required: [code, correlation_id]
      properties:
        code: {type: string}
        correlation_id: {type: string}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 1, maxLength: 1024}
    LoginResponse:
      type: object
      additionalProperties: false
      required: [admin_id, csrf_token, expires_at]
      properties:
        admin_id: {$ref: '#/components/schemas/Uuid'}
        csrf_token: {$ref: '#/components/schemas/Base64url'}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
    AdminProfile:
      type: object
      additionalProperties: false
      required: [id, email, csrf_token]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        email: {type: string, format: email}
        csrf_token: {$ref: '#/components/schemas/Base64url'}
    Device:
      type: object
      additionalProperties: false
      required: [id, display_label, status]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        display_label: {type: string}
        mdm_binding_id: {$ref: '#/components/schemas/Uuid'}
        status:
          type: string
          enum: [DRAFT, INVITED, PENDING_CONFIRMATION, ACTIVE, SUSPENDED, REVOKED, RETIRED]
    DevicePage:
      type: object
      additionalProperties: false
      required: [items, source]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Device'}
        next_cursor: {type: [string, 'null']}
        source: {const: geops}
    InvitationRequest:
      type: object
      additionalProperties: false
      required: [mdm_binding_id, delivery_mode]
      properties:
        mdm_binding_id: {$ref: '#/components/schemas/Uuid'}
        delivery_mode:
          type: string
          enum: [supervised_qr, managed_configuration]
    InvitationResponse:
      type: object
      additionalProperties: false
      required: [invitation_id, geops_device_id, invitation_secret, expires_at]
      properties:
        invitation_id: {$ref: '#/components/schemas/Uuid'}
        geops_device_id: {$ref: '#/components/schemas/Uuid'}
        invitation_secret: {$ref: '#/components/schemas/Base64url'}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
    ClaimRequest:
      type: object
      additionalProperties: false
      required: [invitation_id, invitation_secret, geops_device_id, mdm_device_id, public_key_spki, client_nonce]
      properties:
        invitation_id: {$ref: '#/components/schemas/Uuid'}
        invitation_secret: {$ref: '#/components/schemas/Base64url'}
        geops_device_id: {$ref: '#/components/schemas/Uuid'}
        mdm_device_id: {type: string, minLength: 1}
        public_key_spki: {$ref: '#/components/schemas/Base64url'}
        client_nonce:
          allOf:
            - $ref: '#/components/schemas/Base64url'
          description: 16 bytes aleatorios codificados base64url sin padding.
    ChallengeResponse:
      type: object
      additionalProperties: false
      required: [claim_id, challenge_id, challenge, expires_at]
      properties:
        claim_id: {$ref: '#/components/schemas/Uuid'}
        challenge_id: {$ref: '#/components/schemas/Uuid'}
        challenge: {$ref: '#/components/schemas/Base64url'}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
    RotationChallengeResponse:
      type: object
      additionalProperties: false
      required: [challenge_id, challenge, expires_at]
      properties:
        challenge_id: {$ref: '#/components/schemas/Uuid'}
        challenge: {$ref: '#/components/schemas/Base64url'}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
    ProofRequest:
      type: object
      additionalProperties: false
      required: [challenge_id, signature]
      properties:
        challenge_id: {$ref: '#/components/schemas/Uuid'}
        signature: {$ref: '#/components/schemas/Base64url'}
        attestation_chain:
          type: array
          items: {type: string}
    ProofResponse:
      type: object
      additionalProperties: false
      required: [status, pairing_code, expires_at]
      properties:
        status: {const: PENDING_CONFIRMATION}
        pairing_code: {type: string, pattern: '^[0-9]{8}$'}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
    ActivateRequest:
      type: object
      additionalProperties: false
      required: [claim_id, pairing_code, mdm_verification_method, evidence_ref]
      properties:
        claim_id: {$ref: '#/components/schemas/Uuid'}
        pairing_code: {type: string, pattern: '^[0-9]{8}$'}
        mdm_verification_method: {type: string, enum: [api_read, manual_two_traits]}
        evidence_ref:
          type: string
          minLength: 1
          description: Referencia validada por servidor a evidencia inmutable del mismo claim/tenant/MDM/operador.
    ActivateResponse:
      type: object
      additionalProperties: false
      required: [status, key_id, mdm_binding_id]
      properties:
        status: {const: ACTIVE}
        key_id: {$ref: '#/components/schemas/Uuid'}
        mdm_binding_id: {$ref: '#/components/schemas/Uuid'}
    SessionChallengeRequest:
      type: object
      additionalProperties: false
      required: [geops_device_id, key_id]
      properties:
        geops_device_id: {$ref: '#/components/schemas/Uuid'}
        key_id: {$ref: '#/components/schemas/Uuid'}
    SessionChallengeResponse:
      type: object
      additionalProperties: false
      required: [challenge_id, challenge, server_time, expires_at]
      properties:
        challenge_id: {$ref: '#/components/schemas/Uuid'}
        challenge: {$ref: '#/components/schemas/Base64url'}
        server_time: {$ref: '#/components/schemas/Timestamp'}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
    SessionRequest:
      type: object
      additionalProperties: false
      required: [geops_device_id, key_id, challenge_id, signature]
      properties:
        geops_device_id: {$ref: '#/components/schemas/Uuid'}
        key_id: {$ref: '#/components/schemas/Uuid'}
        challenge_id: {$ref: '#/components/schemas/Uuid'}
        signature: {$ref: '#/components/schemas/Base64url'}
    SessionResponse:
      type: object
      additionalProperties: false
      required: [access_token, expires_at, key_id]
      properties:
        access_token: {$ref: '#/components/schemas/Base64url'}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
        key_id: {$ref: '#/components/schemas/Uuid'}
    RotateRequest:
      type: object
      additionalProperties: false
      required: [challenge_id, new_public_key_spki, old_signature, new_signature]
      properties:
        challenge_id: {$ref: '#/components/schemas/Uuid'}
        new_public_key_spki: {$ref: '#/components/schemas/Base64url'}
        old_signature: {$ref: '#/components/schemas/Base64url'}
        new_signature: {$ref: '#/components/schemas/Base64url'}
        attestation_chain:
          type: array
          items: {type: string}
          description: Certificados de la nueva clave; inválidos se rechazan, ausencia exige excepción antes de uso real.
    RotateResponse:
      type: object
      additionalProperties: false
      required: [new_key_id, status]
      properties:
        new_key_id: {$ref: '#/components/schemas/Uuid'}
        status: {const: ACTIVE}
    MdmStatus:
      type: object
      additionalProperties: false
      required: [provider, connected, edition_evidence]
      properties:
        provider: {type: string, enum: [manageengine, fake]}
        connected: {type: boolean}
        edition_evidence: {type: string, enum: [TRIAL, FREE_UNVERIFIED]}
        region: {type: string}
        last_checked_at: {type: [string, 'null'], format: date-time}
        last_http_status: {type: [integer, 'null']}
        sanitized_error_code: {type: [string, 'null']}
    MdmDevice:
      type: object
      additionalProperties: false
      required: [mdm_device_id, status]
      properties:
        mdm_device_id: {type: string}
        status: {type: string}
        display_name: {type: string}
    MdmDevicePage:
      type: object
      additionalProperties: false
      required: [items, source]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/MdmDevice'}
        next_cursor: {type: [string, 'null']}
        source: {type: string, enum: [fake, manageengine_trial]}
