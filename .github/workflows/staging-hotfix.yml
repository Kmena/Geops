name: Staging gate hotfix validation

on:
  push:
    branches: [codex/staging-upgrade-03e582f]

permissions:
  contents: read

jobs:
  hotfix-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the approved API runtime shape
        run: npm run build --workspace @geops/api-contracts && npm run build --workspace @geops/api
      - name: Hotfix syntax and whitespace
        run: bash -n scripts/staging/upgrade.sh && node --check scripts/staging/reconcile-closed.mjs && git diff --check HEAD^ HEAD
      - name: Repository secret scan
        run: npm run security:scan
