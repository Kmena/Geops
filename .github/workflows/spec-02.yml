name: SPEC-02 synthetic validation

on:
  push:
    branches: [codex/spec-02-wave-1, codex/geops-integration, codex/geops-mdm-security]

permissions:
  contents: read

jobs:
  node-web-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Reproducible install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Source and whitespace checks
        run: git diff --check HEAD~4..HEAD && npm run security:scan && npm run staging:check
      - name: Typecheck, lint and OpenAPI
        run: |
          npm run typecheck && npm run lint && npm run contracts:check
          npx biome check apps/api/test/mdm-real.test.ts apps/api/test/mdm-inventory.integration.mjs apps/api/test/mdm-security.integration.mjs
      - name: Node and Web tests
        run: npm test && node --test specs/spec-02-android-agent-wave-1/contract-vectors.test.mjs
      - name: API and Web builds
        run: npm run build

  kotlin-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Kotlin synthetic core
        run: gradle -p apps/android-agent syntheticTest

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.6'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - name: Compile supervised Android test APK without release signing secrets
        run: gradle -p apps/android-app assembleDebug --no-daemon
      - name: Verify Android build output
        run: test -s apps/android-app/build/outputs/apk/debug/GeopsAndroid-debug.apk

  postgres-postgis:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgis:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: geops_verify_20261019
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d geops_verify_20261019"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      GEOPS_DATA_MODE: synthetic
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/geops_verify_20261019
      GEOPS_MIGRATION_TARGET: geops_verify_20261019
      GEOPS_CONFIRM_MIGRATION_TARGET: geops_verify_20261019
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Reproducible install and build
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
      - name: Explicit disposable migrations
        run: node apps/api/dist/db/migrate.js
      - name: GPS continuity migration and authenticated alerts
        run: |
          container='${{ job.services.postgis.id }}'
          docker exec "$container" createdb -U postgres geops_verify_20261025
          DATABASE_URL=postgres://postgres@127.0.0.1:5432/geops_verify_20261025 npm run gps:continuity:migration:integration --workspace @geops/api
          npm run gps:continuity:integration --workspace @geops/api
      - name: Populated schema upgrade 14 to 20
        run: |
          container='${{ job.services.postgis.id }}'
          docker exec "$container" createdb -U postgres geops_verify_20261021
          DATABASE_URL=postgres://postgres@127.0.0.1:5432/geops_verify_20261021 npm run migration:0015:integration --workspace @geops/api
      - name: Supervised 14 to 20 forward recovery fault injection
        run: |
          container='${{ job.services.postgis.id }}'
          docker exec "$container" createdb -U postgres geops_verify_20261024
          DATABASE_URL=postgres://postgres@127.0.0.1:5432/geops_verify_20261024 npm run migration:0015:integration --workspace @geops/api -- prepare-14
          DATABASE_URL=postgres://postgres@127.0.0.1:5432/geops_verify_20261024 npm run maintenance:recovery:integration --workspace @geops/api
      - name: Supervised recovery from schemas 15, 16, 17 and 18
        run: |
          container='${{ job.services.postgis.id }}'
          for version in 15 16 17 18; do
            database="geops_verify_2026102${version}"
            docker exec "$container" createdb -U postgres "$database"
            DATABASE_URL="postgres://postgres@127.0.0.1:5432/$database" npm run migration:0015:integration --workspace @geops/api -- "prepare-$version"
            DATABASE_URL="postgres://postgres@127.0.0.1:5432/$database" npm run maintenance:recovery:versions --workspace @geops/api -- "$version"
          done
      - name: Isolated persistent-name maintenance rehearsal
        run: |
          container='${{ job.services.postgis.id }}'
          docker exec "$container" createdb -U postgres geops_verify_20261022
          DATABASE_URL=postgres://postgres@127.0.0.1:5432/geops_verify_20261022 npm run migration:0015:integration --workspace @geops/api -- prepare-14
          docker exec "$container" pg_dump -U postgres -d geops_verify_20261022 -Fc -f /tmp/geops-pre0015.dump
          docker exec "$container" createdb -U postgres geops_dev
          docker exec "$container" pg_restore -U postgres -d geops_dev /tmp/geops-pre0015.dump
          GEOPS_DISPOSABLE_MAINTENANCE_REHEARSAL=YES DATABASE_URL=postgres://postgres@127.0.0.1:5432/geops_dev npm run maintenance:cli:rehearsal --workspace @geops/api
      - name: Authenticated synthetic PostgreSQL regressions
        run: |
          npm run device:enrollment:integration --workspace @geops/api
          npm run gps:integration --workspace @geops/api
          npm run gps:config:integration --workspace @geops/api
          npm run gps:health:integration --workspace @geops/api
          npm run gps:events:integration --workspace @geops/api
          npm run gps:mixed:integration --workspace @geops/api
          npm run gps:operations:integration --workspace @geops/api
          npm run gps:capability:integration --workspace @geops/api
          npm run admin:tenant:integration --workspace @geops/api
          npm run admin:users:integration --workspace @geops/api
          npm run maintenance:integration --workspace @geops/api
          npm run gps:scheduler:load --workspace @geops/api
      - name: MDM inventory migration and authorized synchronization on fresh schema
        run: |
          container='${{ job.services.postgis.id }}'
          docker exec "$container" createdb -U postgres geops_verify_20261026
          DATABASE_URL=postgres://postgres@127.0.0.1:5432/geops_verify_20261026 npm run mdm:integration --workspace @geops/api
      - name: MDM disconnect persistence and administrator login limits
        run: |
          container='${{ job.services.postgis.id }}'
          docker exec "$container" createdb -U postgres geops_verify_20261027
          DATABASE_URL=postgres://postgres@127.0.0.1:5432/geops_verify_20261027 npm run mdm:security:integration --workspace @geops/api
      - name: Disposable clean Staging 0018 reinstall and interactive bootstrap
        if: github.ref_name != 'codex/geops-mdm-security'
        run: |
          git -c advice.detachedHead=false switch --detach HEAD
          bash scripts/staging/test-clean-reinstall-0018.sh
      - name: Backup, isolated restore and rollback probe
        run: |
          container='${{ job.services.postgis.id }}'
          docker exec "$container" pg_dump -U postgres -d geops_verify_20261019 -Fc -f /tmp/spec02.dump
          docker exec "$container" createdb -U postgres geops_verify_20261019_restore
          docker exec "$container" pg_restore -U postgres -d geops_verify_20261019_restore /tmp/spec02.dump
          source_count=$(docker exec "$container" psql -U postgres -d geops_verify_20261019 -Atc 'SELECT count(*) FROM geops_schema_migrations')
          restore_count=$(docker exec "$container" psql -U postgres -d geops_verify_20261019_restore -Atc 'SELECT count(*) FROM geops_schema_migrations')
          expected_count=$(find apps/api/src/db/migrations -maxdepth 1 -name '*.sql' | wc -l)
          test "$source_count" = "$expected_count"
          test "$source_count" = "$restore_count"
          docker exec "$container" psql -U postgres -d geops_verify_20261019_restore -v ON_ERROR_STOP=1 -c 'BEGIN; ALTER TABLE gps_scheduler_run ADD COLUMN ci_rollback_probe boolean; ROLLBACK;'
          probe_count=$(docker exec "$container" psql -U postgres -d geops_verify_20261019_restore -Atc "SELECT count(*) FROM information_schema.columns WHERE table_name='gps_scheduler_run' AND column_name='ci_rollback_probe'")
          test "$probe_count" = 0
          DATABASE_URL=postgres://postgres@127.0.0.1:5432/geops_verify_20261019_restore npm run release:restore:integration --workspace @geops/api
          docker exec "$container" createdb -U postgres geops_verify_20261023_restore
          GEOPS_TEST_DB=geops_verify_20261023_restore DATABASE_URL=postgres://postgres@127.0.0.1:5432/geops_verify_20261023_restore node apps/api/test/restore-gate.mjs
