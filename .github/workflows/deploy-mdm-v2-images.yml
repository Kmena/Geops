name: Build MDM v2 immutable images

# Publishes artifacts only; never connects to Staging.
on:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        required: true
        default: false
      approved_sha:
        type: string
        required: false
      safe_api_digest:
        type: string
        required: true
      safe_web_digest:
        type: string
        required: true

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Authorize immutable publication
        env:
          PUBLISH: ${{ inputs.publish }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: node scripts/deploy/publication-gate.mjs
      - id: source_ci
        name: Verify exact source CI
        if: inputs.publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/deploy/verify-source-ci.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run security:scan && npm run staging:check && npm run staging:caddy:check && npm run typecheck && npm run lint && npm run contracts:check && npm test && npm run build
      - run: npx biome check scripts/deploy && node --test scripts/deploy/*.test.mjs
      - run: python -B -m unittest discover -s scripts/deploy/remote -p 'test_geops_deploy_v2.py' -v
      - uses: docker/setup-buildx-action@v3
        if: inputs.publish && github.ref == 'refs/heads/main'
      - uses: docker/login-action@v3
        if: inputs.publish && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: repository
        if: inputs.publish && github.ref == 'refs/heads/main'
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: safe_images
        name: Verify retained B22-safe images
        if: inputs.publish && github.ref == 'refs/heads/main'
        env:
          SAFE_API: ${{ inputs.safe_api_digest }}
          SAFE_WEB: ${{ inputs.safe_web_digest }}
          IMAGE_REPOSITORY: ${{ steps.repository.outputs.name }}
        shell: bash
        run: |
          [[ "$IMAGE_REPOSITORY" = 'ghcr.io/kmena/geops' ]]
          [[ "$SAFE_API" =~ ^ghcr\.io/kmena/geops-api@sha256:[a-f0-9]{64}$ ]]
          [[ "$SAFE_WEB" =~ ^ghcr\.io/kmena/geops-web@sha256:[a-f0-9]{64}$ ]]
          docker pull "$SAFE_API"
          docker pull "$SAFE_WEB"
          test "$(docker image inspect "$SAFE_API" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = '56afe74773f084b751fe97dc036e18460b797433'
          test "$(docker image inspect "$SAFE_API" --format '{{index .Config.Labels "org.geops.api.variant"}}')" = 'B22-safe'
          test "$(docker image inspect "$SAFE_WEB" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = '56afe74773f084b751fe97dc036e18460b797433'
          test "$(docker image inspect "$SAFE_WEB" --format '{{index .Config.Labels "org.geops.web.variant"}}')" = 'gps-base'
          test "$(docker image inspect "$SAFE_WEB" --format '{{index .Config.Labels "org.geops.web.mdm_enabled"}}')" = 'false'
          echo "api=$SAFE_API" >> "$GITHUB_OUTPUT"
          echo "web=$SAFE_WEB" >> "$GITHUB_OUTPUT"
      - id: api_mdm
        uses: docker/build-push-action@v7
        if: inputs.publish && github.ref == 'refs/heads/main'
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          push: true
          tags: ${{ steps.repository.outputs.name }}-api:${{ github.sha }}-b22-mdm
          build-args: GEOPS_API_VARIANT=B22-mdm
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.geops.api.variant=B22-mdm
      - id: web_mdm
        uses: docker/build-push-action@v7
        if: inputs.publish && github.ref == 'refs/heads/main'
        with:
          context: .
          file: infrastructure/docker/web.Dockerfile
          push: true
          tags: ${{ steps.repository.outputs.name }}-web:${{ github.sha }}-mdm-qa
          build-args: |
            GEOPS_WEB_BASE=/
            MDM_ENABLED=true
            VITE_GPS_TIME_ZONE=America/Costa_Rica
            VITE_GPS_TILE_URL=
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.geops.web.base=/
            org.geops.web.variant=mdm-qa
            org.geops.web.mdm_enabled=true
            org.geops.web.gps_time_zone=America/Costa_Rica
      - name: Create signed-release input manifest
        if: inputs.publish && github.ref == 'refs/heads/main'
        env:
          API_SAFE: ${{ steps.safe_images.outputs.api }}
          API_MDM: ${{ steps.api_mdm.outputs.digest }}
          WEB_GPS: ${{ steps.safe_images.outputs.web }}
          WEB_MDM: ${{ steps.web_mdm.outputs.digest }}
          CI_RUN: ${{ steps.source_ci.outputs.ci_run }}
          PUBLICATION_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IMAGE_REPOSITORY: ${{ steps.repository.outputs.name }}
        run: |
          node scripts/deploy/create-manifest-v2.mjs release-manifest-v2.json "${GITHUB_SHA}" \
            "${API_SAFE}" \
            "${IMAGE_REPOSITORY}-api@${API_MDM}" \
            "${WEB_GPS}" \
            "${IMAGE_REPOSITORY}-web@${WEB_MDM}" \
            "${CI_RUN}" "${PUBLICATION_RUN}"
      - uses: actions/upload-artifact@v4
        if: inputs.publish && github.ref == 'refs/heads/main'
        with:
          name: geops-mdm-v2-release-${{ github.sha }}
          path: release-manifest-v2.json
          retention-days: 90
