name: Wave 0A foundation
on:
  push:
    branches: [codex/spec-01-wave-0a]
  pull_request:
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run contracts:check
      - run: npm run lint
      - run: npm run security:scan
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
