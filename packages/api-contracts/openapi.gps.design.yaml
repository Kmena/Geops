    "schemas": {
      "PolicyInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "days_iso",
          "start_local",
          "end_local",
          "time_zone",
          "capture_interval_s",
          "sync_interval_s",
          "heartbeat_missing_after_s",
          "valid_from",
          "valid_until"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "days_iso": {
            "type": "array",
            "minItems": 1,
            "uniqueItems": true,
            "items": {
              "type": "integer",
              "minimum": 1,
              "maximum": 7
            }
          },
          "start_local": {
            "type": "string",
            "pattern": "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          },
          "end_local": {
            "type": "string",
            "pattern": "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          },
          "time_zone": {
            "type": "string",
            "minLength": 3,
            "maxLength": 80,
            "description": "Valid IANA name; server validates against tzdb."
          },
          "capture_interval_s": {
            "type": "integer",
            "minimum": 30,
            "maximum": 300
          },
          "sync_interval_s": {
            "type": "integer",
            "minimum": 60,
            "maximum": 900
          },
          "heartbeat_missing_after_s": {
            "type": "integer",
            "minimum": 300,
            "maximum": 7200,
            "default": 900
          },
          "valid_from": {
            "type": "string",
            "format": "date-time"
          },
          "valid_until": {
            "type": "string",
            "format": "date-time"
          },
          "exceptions": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/PolicyException"
            }
          },
          "health_interval_s": {
            "type": "integer",
            "minimum": 60,
            "maximum": 3600,
            "default": 300,
            "description": "GPS-HEALTH-001 SDD amendment; optional input defaults to 300 s"
          }
        }
      },
      "PolicyPatch": {
        "type": "object",
        "additionalProperties": false,
        "minProperties": 1,
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "days_iso": {
            "type": "array",
            "minItems": 1,
            "uniqueItems": true,
            "items": {
              "type": "integer",
              "minimum": 1,
              "maximum": 7
            }
          },
          "start_local": {
            "type": "string",
            "pattern": "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          },
          "end_local": {
            "type": "string",
            "pattern": "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          },
          "time_zone": {
            "type": "string",
