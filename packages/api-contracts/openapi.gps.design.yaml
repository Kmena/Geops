            "enum": [
              "ONLINE",
              "OFFLINE",
              "UNKNOWN"
            ]
          }
        }
      },
      "HeartbeatAck": {
        "type": "object",
        "required": [
          "event_id",
          "persisted_at"
        ],
        "properties": {
          "event_id": {
            "type": "string",
            "format": "uuid"
          },
          "persisted_at": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "SessionEvent": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "event_id",
          "type",
          "occurred_at",
          "assignment_version",
          "boot_id",
          "elapsed_realtime_ms"
