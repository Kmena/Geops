        "requestBody": { "required": true, "content": { "application/json": { "schema": { "type": "object", "additionalProperties": false, "required": ["request_id", "reason"], "properties": { "request_id": { "type": "string", "format": "uuid" }, "reason": { "type": "string", "minLength": 8, "maxLength": 240 } } } } } },
        "responses": { "204": { "description": "Account revoked or exact retry" }, "403": { "description": "Forbidden" }, "409": { "description": "Conflict" } }
      }
    },
    "/v1/admin/gps-capabilities": {
      "get": {
        "operationId": "listOwnGpsCapabilities",
        "security": [{ "adminCookie": [] }],
        "responses": { "200": { "description": "Current active GPS capabilities and tenant_ids; tenant IDs require both data and health grants" }, "401": { "description": "Unauthenticated" } }
      }
    },
    "/v1/admin/gps-devices": {
      "get": {
        "operationId": "listAuthorizedGpsDevices",
        "description": "Requires gps.session.read and an explicit active tenant grant; at most 100 devices. Each item includes canonical display_label alongside its stable device_id for compatible clients.",
        "security": [{ "adminCookie": [] }],
        "responses": { "200": { "description": "Tenant-filtered devices", "content": { "application/json": { "schema": {
          "type": "object", "required": ["items"], "properties": { "items": { "type": "array", "maxItems": 100, "items": {
            "type": "object", "required": ["device_id", "display_label", "tenant_id", "installation_id", "assignment_version"],
            "properties": {
              "device_id": { "type": "string", "format": "uuid" },
              "display_label": { "type": "string", "description": "Canonical name from geops_device; may be empty" },
              "tenant_id": { "type": "string" },
              "installation_id": { "type": "string", "format": "uuid", "nullable": true },
              "assignment_version": { "type": "integer", "minimum": 0 }
            }
          } } }
        } } } }, "401": { "description": "Unauthenticated" }, "403": { "description": "Missing capability" } }
      }
    },
    "/v1/admin/gps-installations": {
      "post": {
        "operationId": "activateGpsInstallation",
        "description": "Synthetic only; requires gps.installation.manage and active access to the device tenant. Installation ID is server generated.",
        "security": [{ "adminCookie": [], "csrfHeader": [] }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": {
          "type": "object", "additionalProperties": false, "required": ["device_id", "reason"],
          "properties": { "device_id": { "type": "string", "format": "uuid" }, "reason": { "type": "string", "minLength": 8, "maxLength": 240 } }
        } } } },
        "responses": { "201": { "description": "Installation activated" }, "401": { "description": "Unauthenticated" }, "403": { "description": "Forbidden" }, "409": { "description": "Active installation or binding conflict" }, "422": { "description": "Invalid request" } }
      }
    },
    "/v1/admin/gps-installations/{id}/retire": {
      "post": {
        "operationId": "retireGpsInstallation",
        "description": "Requires gps.installation.manage and active access to the installation tenant; existing key cannot fetch GPS config after retirement.",
        "security": [{ "adminCookie": [], "csrfHeader": [] }],
        "parameters": [{ "name": "id", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": {
          "type": "object", "additionalProperties": false, "required": ["reason"],
          "properties": { "reason": { "type": "string", "minLength": 8, "maxLength": 240 } }
        } } } },
        "responses": { "204": { "description": "Retired" }, "401": { "description": "Unauthenticated" }, "403": { "description": "Forbidden" }, "404": { "description": "Not found" } }
      }
    },
    "/v1/admin/gps-tenant-grants/proposals": {
      "post": {
        "operationId": "proposeGpsTenantGrant",
        "description": "Requires gps.tenant.grant; a separate capable admin must approve. GRANT and REVOKE use this flow.",
        "security": [{ "adminCookie": [], "csrfHeader": [] }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": {
          "type": "object", "additionalProperties": false,
          "required": ["request_id", "target_admin_id", "tenant_id", "action", "reason"],
          "properties": {
            "request_id": { "type": "string", "format": "uuid" },
            "target_admin_id": { "type": "string", "format": "uuid" },
            "tenant_id": { "type": "string", "minLength": 1, "maxLength": 256 },
            "action": { "type": "string", "enum": ["GRANT", "REVOKE"] },
            "reason": { "type": "string", "minLength": 8, "maxLength": 240 }
          }
        } } } },
        "responses": { "201": { "description": "Pending proposal" }, "200": { "description": "Idempotent replay" }, "401": { "description": "Unauthenticated" }, "403": { "description": "Forbidden" }, "409": { "description": "Request ID conflict" }, "422": { "description": "Invalid request" } }
      }
    },
    "/v1/admin/gps-tenant-grants/{id}/approve": {
      "post": {
        "operationId": "approveGpsTenantGrant",
        "description": "Requires gps.tenant.grant and a distinct authenticated administrator; updates health and data grants atomically.",
        "security": [{ "adminCookie": [], "csrfHeader": [] }],
        "parameters": [{ "name": "id", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }],
        "responses": { "200": { "description": "Approved" }, "401": { "description": "Unauthenticated" }, "403": { "description": "Same proposer or missing capability" }, "404": { "description": "Not found" }, "409": { "description": "Conflicting grant state" }, "410": { "description": "Proposal expired" } }
      }
    }
  },
