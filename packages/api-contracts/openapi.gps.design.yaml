        "type": "object",
        "additionalProperties": false,
        "required": [
          "scheduled_session_id",
          "start_at",
          "end_at"
        ],
        "properties": {
          "scheduled_session_id": {
            "type": "string",
            "format": "uuid"
          },
          "start_at": {
            "type": "string",
            "format": "date-time"
          },
          "end_at": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "ConfigSnapshot": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "schema_version",
          "capture_anchor_id",
          "device_id",
          "installation_id",
          "assignment_version",
          "active",
          "server_time",
          "verified_at",
          "offline_not_after",
          "window_instances"
        ],
        "properties": {
          "schema_version": {
            "const": 1
          },
          "capture_anchor_id": {
            "type": "string",
            "format": "uuid"
          },
          "device_id": {
            "type": "string",
            "format": "uuid"
          },
          "installation_id": {
            "type": "string",
            "format": "uuid"
          },
          "assignment_version": {
            "type": "integer",
            "minimum": 0
          },
          "active": {
            "type": "boolean"
          },
          "policy_id": {
            "type": "string",
            "format": "uuid"
          },
          "policy_revision": {
            "type": "integer",
            "minimum": 1
          },
          "policy": {
            "$ref": "#/components/schemas/PolicyInput"
          },
          "server_time": {
            "type": "string",
            "format": "date-time"
          },
          "verified_at": {
            "type": "string",
            "format": "date-time"
          },
          "offline_not_after": {
            "type": "string",
            "format": "date-time"
          },
          "tzdb_version": {
            "type": "string"
          },
          "window_instances": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/WindowInstance"
            }
          }
        },
        "allOf": [
          {
            "if": {
              "properties": {
                "active": {
                  "const": true
                }
              },
              "required": [
                "active"
              ]
            },
            "then": {
              "required": [
                "policy_id",
                "policy_revision",
                "policy",
                "tzdb_version"
              ]
            }
          },
          {
            "if": {
              "properties": {
                "active": {
                  "const": false
                }
              },
              "required": [
                "active"
              ]
            },
            "then": {
              "properties": {
                "window_instances": {
                  "maxItems": 0
                }
              },
              "not": {
                "anyOf": [
                  {
                    "required": [
                      "policy_id"
                    ]
                  },
                  {
                    "required": [
                      "policy_revision"
                    ]
                  },
                  {
                    "required": [
                      "policy"
                    ]
                  }
                ]
              }
            }
          }
        ]
