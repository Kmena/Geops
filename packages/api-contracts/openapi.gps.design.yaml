{
  "openapi": "3.1.0",
  "info": {
    "title": "GEOPS SPEC-02 GPS policies and sessions — DESIGN ONLY",
    "version": "0.1.0-design",
    "description": "W1-A design baseline. Not deployed. SPEC-00 device PoP bytes and SPEC-01 admin cookie/CSRF remain authoritative; no anonymous policy access."
  },
  "servers": [
    {
      "url": "https://geops.example.invalid",
      "description": "Illustrative host; no deployment target"
    }
  ],
  "tags": [
    {
      "name": "GpsAdmin"
    },
    {
      "name": "GpsDevice"
    }
  ],
  "paths": {
    "/v1/admin/enrollment/devices": {
      "get": {
        "tags": ["GpsAdmin"],
        "operationId": "listSyntheticEnrollmentDevices",
        "description": "SPEC-02 additive enrollment view limited to fake/synthetic bindings. The approved SPEC-01 inventory response remains unchanged. Requires gps.installation.manage and authenticated admin; audited.",
        "security": [{ "adminCookie": [] }],
        "parameters": [
          { "$ref": "#/components/parameters/Cursor" },
          { "$ref": "#/components/parameters/Limit" }
        ],
        "responses": {
          "200": { "description": "Synthetic enrollment inventory with invitation and communication state", "content": { "application/json": { "schema": {
            "type": "object", "required": ["items", "next_cursor", "source"],
            "properties": {
              "source": { "const": "geops" },
              "next_cursor": { "type": ["string", "null"] },
              "items": { "type": "array", "items": { "type": "object", "required": ["id", "display_label", "status", "mdm_binding_id", "tenant_id", "mdm_device_id"],
                "properties": {
                  "id": { "type": "string", "format": "uuid" }, "display_label": { "type": "string" }, "status": { "type": "string" },
                  "mdm_binding_id": { "type": "string", "format": "uuid" }, "tenant_id": { "const": "synthetic" }, "mdm_device_id": { "type": "string" },
                  "enrolled_at": { "type": ["string", "null"], "format": "date-time" },
                  "last_communication_at": { "type": ["string", "null"], "format": "date-time" },
                  "invitation_id": { "type": ["string", "null"] }, "invitation_status": { "type": ["string", "null"] },
                  "invitation_expires_at": { "type": ["string", "null"], "format": "date-time" },
                  "claim_id": { "type": ["string", "null"] }, "claim_status": { "type": ["string", "null"] },
                  "key_id": { "type": ["string", "null"] }, "installation_id": { "type": ["string", "null"] },
                  "last_installation_retired_at": { "type": ["string", "null"], "format": "date-time" },
                  "policy_name": { "type": ["string", "null"] }, "session_state": { "type": ["string", "null"] }
                } } }
            }
          } } } },
          "401": { "description": "Unauthenticated" }, "403": { "description": "Forbidden" }
        }
      }
    },
    "/v1/admin/devices/{device_id}/suspend": {
      "post": {
        "tags": ["GpsAdmin"], "operationId": "suspendDevice",
        "description": "Synthetic tenant only. Requires gps.installation.manage, both tenant grants, admin cookie, Origin and CSRF. Revokes issued sessions and retires active GPS installation, preserving history. Repeating a suspension is idempotent.",
        "security": [{ "adminCookie": [], "csrfHeader": [] }],
        "parameters": [{ "$ref": "#/components/parameters/DeviceId" }, { "$ref": "#/components/parameters/Origin" }, { "$ref": "#/components/parameters/Csrf" }],
        "requestBody": { "$ref": "#/components/requestBodies/DeviceLifecycleReason" },
        "responses": { "200": { "description": "SUSPENDED" }, "401": { "description": "Unauthenticated" }, "403": { "description": "Forbidden" }, "409": { "description": "Invalid transition or binding" } }
      }
    },
    "/v1/admin/devices/{device_id}/reactivate": {
      "post": {
        "tags": ["GpsAdmin"], "operationId": "reactivateDevice",
        "description": "Synthetic tenant only. Requires valid active binding and PoP key, compatible policy, no installation or open enrollment. Does not reactivate GPS.",
        "security": [{ "adminCookie": [], "csrfHeader": [] }],
        "parameters": [{ "$ref": "#/components/parameters/DeviceId" }, { "$ref": "#/components/parameters/Origin" }, { "$ref": "#/components/parameters/Csrf" }],
        "requestBody": { "$ref": "#/components/requestBodies/DeviceLifecycleReason" },
        "responses": { "200": { "description": "ACTIVE" }, "401": { "description": "Unauthenticated" }, "403": { "description": "Forbidden" }, "409": { "description": "Invalid transition or security precondition" } }
      }
    },
    "/v1/admin/devices/{device_id}/revoke": {
      "post": {
        "tags": ["GpsAdmin"], "operationId": "revokeDeviceIdentity",
        "description": "Terminal identity revocation for the synthetic tenant. Requires gps.installation.manage, both tenant grants, admin cookie, Origin and CSRF. Preserves historical data.",
        "security": [{ "adminCookie": [], "csrfHeader": [] }],
        "parameters": [{ "$ref": "#/components/parameters/DeviceId" }, { "$ref": "#/components/parameters/Origin" }, { "$ref": "#/components/parameters/Csrf" }],
        "requestBody": { "$ref": "#/components/requestBodies/DeviceLifecycleReason" },
        "responses": { "200": { "description": "REVOKED" }, "401": { "description": "Unauthenticated" }, "403": { "description": "Forbidden" }, "409": { "description": "Binding conflict" } }
      }
    },
    "/v1/admin/devices/{device_id}/retire": {
      "post": {
        "tags": ["GpsAdmin"], "operationId": "retireDeviceIdentity",
        "description": "Terminal retirement for the synthetic tenant. Requires gps.installation.manage, both tenant grants, admin cookie, Origin and CSRF. The record remains in historical inventory.",
        "security": [{ "adminCookie": [], "csrfHeader": [] }],
        "parameters": [{ "$ref": "#/components/parameters/DeviceId" }, { "$ref": "#/components/parameters/Origin" }, { "$ref": "#/components/parameters/Csrf" }],
        "requestBody": { "$ref": "#/components/requestBodies/DeviceLifecycleReason" },
        "responses": { "200": { "description": "RETIRED" }, "401": { "description": "Unauthenticated" }, "403": { "description": "Forbidden" }, "409": { "description": "Binding conflict" } }
      }
    },
    "/v1/admin/devices/{device_id}/invitations/{invitation_id}": {
      "delete": {
        "tags": ["GpsAdmin"], "operationId": "cancelDeviceInvitation",
        "description": "Cancels one open invitation and its unactivated claim atomically; audit records the cancellation. Requires gps.installation.manage; synthetic binding only.",
        "security": [{ "adminCookie": [], "csrfHeader": [] }],
        "parameters": [
          { "$ref": "#/components/parameters/DeviceId" },
          { "name": "invitation_id", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
          { "$ref": "#/components/parameters/Origin" },
          { "$ref": "#/components/parameters/Csrf" }
        ],
        "responses": {
          "200": { "description": "Invitation cancelled", "content": { "application/json": { "schema": { "type": "object", "required": ["status"], "properties": { "status": { "const": "CANCELLED" } } } } } },
          "401": { "description": "Unauthenticated" }, "403": { "description": "Forbidden" },
          "404": { "description": "Not found" }, "409": { "description": "Invitation not open" }
        }
      }
    },
