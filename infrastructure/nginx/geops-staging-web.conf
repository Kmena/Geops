server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log off;
  error_log /dev/stderr warn;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
  add_header Cache-Control no-store always;

  location = /health {
    default_type text/plain;
    return 200 "ok";
  }
  location /v1/ {
    proxy_pass http://geops-api:3500;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-Id $request_id;
    proxy_http_version 1.1;
  }
  location ^~ /assets/ {
    try_files $uri =404;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
