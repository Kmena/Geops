services:
  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_PASSWORD: synthetic-only
    ports:
      - "127.0.0.1:${GEOPS_LAB_PG_PORT:-55446}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 1s
      timeout: 3s
      retries: 90
