# V2 controller only. The reviewed root-owned bundle supplies these files.
services:
  geops-api:
    environment:
      MDM_ENABLED: "true"
      GEOPS_MDM_REGION: ${GEOPS_MDM_REGION:?Reviewed test tenant region required}
      GEOPS_MDM_EDITION: ${GEOPS_MDM_EDITION:?Reviewed test tenant edition required}
      GEOPS_MDM_CUSTOMER_ID: ${GEOPS_MDM_CUSTOMER_ID:?Reviewed test customer required}
      GEOPS_MDM_TEST_TENANT: "1"
    secrets: [db_password, admin_session_key, admin_csrf_key, invitation_hmac_key, mdm_grant_key, gps_quarantine_key, mdm_client_id, mdm_client_secret]
    networks:
      stage_app: {}
      stage_db: {}
      stage_egress: {}
  geops-web:
    build:
      args:
        MDM_ENABLED: "true"
secrets:
  mdm_client_id:
    file: ./.local/staging/secrets/mdm_client_id
  mdm_client_secret:
    file: ./.local/staging/secrets/mdm_client_secret
networks:
  stage_egress:
    name: geops_spec02_mdm_stage_egress
